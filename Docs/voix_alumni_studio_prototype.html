:flex;gap:12px;align-items:center;padding:12px 15px;background:#f6eee6;border-radius:12px}.calendar .num{font:normal 30px Georgia,serif}.progress{height:7px;border-radius:10px;background:#e9ded2;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:#b38b69;transition:width .2s}.fine{font-size:11px;color:#92877d}.tipbar{margin-top:24px;padding:11px 14px;border-radius:9px;background:#eee4d9;color:#6d5947;font-size:12px}.remind{padding:15px;border:1px solid var(--line);border-radius:12px;margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:15px}.remind strong{font-size:13px}.remind small{display:block;color:#8a8077;margin-top:3px}.logo-rule{border-top:1px solid #d8baa1;width:100%;margin:9px 0}.mobile-bar{display:none}

<script>
const stages = [
 {title:'Repérage et contact',short:'Prospection',owner:'lead',description:'Constituer le vivier et identifier une personne pertinente à inviter.',tasks:[['Créer la fiche de l’alumni','lead',true],['Renseigner la promotion et le parcours connu','lead',true],['Effectuer la première prise de contact','lead',true],['Ajouter des notes ou pistes de discussion','lead',false]],note:'Aucune session n’est imposée à cette étape : un alumni peut rester dans le vivier plusieurs mois.'},
 {title:'Confirmation et passage de relais',short:'Transmission',owner:'lead',description:'Obtenir l’accord de principe et transmettre les informations utiles à la production.',tasks:[['Confirmer la participation de l’alumni','lead',true],['Convenir d’une date et du fuseau horaire','lead',true],['Transmettre la photo, le poste et l’entreprise','lead',true],['Notifier la production de la nouvelle proposition','lead',true]],note:'La responsable reste l’unique interlocutrice externe de l’intervenant, y compris après la transmission.'},
 {title:'Dossier et questions',short:'Préparation',owner:'production',description:'Contrôler les informations reçues et construire le contenu du webinaire.',tasks:[['Vérifier l’orthographe du nom, la promotion et la fonction','production',true],['Vérifier la qualité et l’autorisation d’usage de la photo','production',true],['Compléter la biographie à partir de sources fiables','production',false],['Préparer la trame de questions commune et personnalisée','production',true],['Faire remonter les questions manquantes à la responsable','production',false]],note:'Une information manquante génère une demande interne à la responsable, jamais un message direct à l’alumni.'},
 {title:'Affiche et annonce',short:'Communication',owner:'production',description:'Préparer, valider puis diffuser la communication autour de la session.',tasks:[['Générer et vérifier l’affiche d’annonce','production',true],['Rédiger le message WhatsApp de la communauté','production',true],['Obtenir la validation requise sur les contenus','lead',true],['Publier l’annonce à J-7 ou selon le calendrier choisi','production',true],['Marquer la publication comme effectuée','production',true]],note:'« Contenu prêt » et « réellement publié » sont deux états distincts. Aucun envoi WhatsApp n’est réalisé par cette maquette.'},
 {title:'Réunion et rappels',short:'Logistique',owner:'production',description:'Sécuriser tous les liens et préparer le jour J.',tasks:[['Créer ou enregistrer le lien Microsoft Teams','production',true],['Préparer le formulaire de feedback de l’épisode','production',true],['Vérifier le lien de réunion et les accès','production',true],['Préparer le rappel destiné à la communauté (J-1)','production',true],['Transmettre à la responsable le conducteur final','production',true]],note:'Les dates relatives se recalculent en cas de report, sans effacer l’historique des publications déjà effectuées.'},
 {title:'Jour du webinaire',short:'Jour J',owner:'lead',description:'Conduire la session et s’assurer de la disponibilité de l’enregistrement.',tasks:[['Vérifier la présence et les accès','production',true],['Animer la rencontre et les échanges','lead',true],['Vérifier l’accord et la disponibilité de l’enregistrement','lead',true],['Noter les citations et moments marquants','production',false]],note:'La responsable assure l’animation. La plateforme peut afficher une fiche « conducteur » lisible sur ordinateur ou mobile.'},
 {title:'Remerciements et feedback',short:'Après-session',owner:'production',description:'Remercier à chaud puis recueillir les retours de la communauté.',tasks:[['Publier un message court de remerciement','production',true],['Partager le formulaire de feedback','production',true],['Vérifier les premières réponses','production',false],['Préparer une synthèse des enseignements','production',false]],note:'Le remerciement à chaud est distinct de l’affiche finale de remerciement, qui peut utiliser une citation extraite de la vidéo.'},
 {title:'Replay et clôture',short:'Archivage',owner:'production',description:'Valoriser la session et conserver ses ressources.',tasks:[['Ajouter ou publier le replay YouTube autorisé','production',true],['Récupérer et relire la transcription','production',true],['Sélectionner et faire valider une citation','lead',false],['Produire l’affiche et le message de remerciement final','production',true],['Partager le lien du replay à la communauté','production',true],['Archiver les ressources et clôturer l’épisode','production',true]],note:'La transcription et les citations doivent être vérifiées ; la publication du replay suppose les autorisations appropriées.'}
];
const seededEpisodes = [
 {id:'10',name:'Sennen Ekouagne',promo:'2007',job:'Senior Software Engineer',company:'Datadog',date:'2026-10-25',time:'18:00',state:'En préparation',tag:'Annonce disponible',status:'prep'},
 {id:'11',name:'Alassane Mballo',promo:'2018',job:'Technical Leader Tender MV/LV',company:'Schneider Electric',date:'2026-11-08',time:'À confirmer',state:'Proposition',tag:'Informations transmises',status:'proposed'},
 {id:'09',name:'Ézéchiel Ouattara',promo:'2018',job:'Consultant en transformation digitale',company:'',date:'2026-09-27',time:'18:00',state:'Session passée',tag:'Archives à compléter',status:'past'}
];
const defaults = {role:'production',page:'dashboard',episode:'10',stage:3,checks:{},requests:[{id:1,episode:'11',text:'Confirmer l’intitulé exact du poste d’Alassane avant validation de l’affiche.',resolved:false}],messages:{announcement:'🎙 VOIX D’ALUMNI — PROCHAINE SESSION !\n\nNous aurons le plaisir de retrouver Sennen Ekouagne, promotion 2007, Senior Software Engineer chez Datadog.\n\n📅 Dimanche 25 octobre 2026\n🕕 18 h (GMT+2)\n💻 En visioconférence\n\nParcours, expériences et conseils inspirants.\n\n[Ajouter ici le lien Teams validé]',thanks:'🙏 Merci à toutes et à tous pour votre participation à Voix d’Alumni !\n\nVotre retour compte pour préparer les prochains épisodes.\n\n👉 [Insérer le lien de feedback validé]'},candidates:[]};
let appState = {...defaults};try{const stored=JSON.parse(localStorage.getItem('vas-demo-v2')||'{}');appState={...defaults,...stored,checks:{...defaults.checks,...stored.checks},messages:{...defaults.messages,...stored.messages},requests:stored.requests||defaults.requests,candidates:stored.candidates||[]}}catch(e){}
const getEpisodes=()=>seededEpisodes.concat(appState.candidates||[]);
const ep=()=>getEpisodes().find(x=>x.id===appState.episode)||seededEpisodes[0];
const save=()=>{try{localStorage.setItem('vas-demo-v2',JSON.stringify(appState))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const datefmt=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return 'Date à définir';try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}catch(e){return 'Date à définir'}};
const roleName=x=>x==='lead'?'Responsable':'Production';
const allTasks=()=>stages.flatMap((s,si)=>s.tasks.map((t,ti)=>({key:ep().id+'-'+si+'-'+ti,text:t[0],owner:t[1],required:t[2],phase:si})));
const checked=k=>!!appState.checks[k];
const totalProgress=id=>{let total=0,done=0;stages.forEach((s,si)=>s.tasks.forEach((t,ti)=>{if(t[2]){total++;if(checked(id+'-'+si+'-'+ti))done++}}));return {done,total,pct:Math.round(done/total*100)}};
const makeBadge=(t,type='')=>`<span class="badge ${type}">${esc(t)}</span>`;
function roleSwitch(){return `<div class="role-switch"><button onclick="setRole('lead')" class="${appState.role==='lead'?'active':''}">Responsable</button><button onclick="setRole('production')" class="${appState.role==='production'?'active':''}">Production</button></div>`}
const navItems=[['dashboard','◫','Tableau de bord'],['episodes','▦','Épisodes'],['people','♙','Intervenants'],['studio','✧','Studio créatif'],['messages','◱','Communications'],['feedback','▤','Feedback'],['library','▣','Médiathèque'],['settings','⚙','Paramètres']];
function render(){let page=appState.page;document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">♩</div><div><h1>Voix d’Alumni</h1><span>Studio organisateur</span></div></div><div><div class="nav-label">Navigation</div><nav class="nav">${navItems.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="sym">${n[1]}</span>${n[2]}</button>`).join('')}</nav></div><div class="role-mini"><small>Espace actuellement affiché</small><strong>${appState.role==='lead'?'Responsable de l’initiative':'Coordination & production'}</strong><div style="margin-top:10px"><span class="demo-tag">Prototype • données démo</span></div></div></aside><main class="main"><header class="topbar"><div><div class="crumb">VOIX D’ALUMNI <span style="color:#c2a88e">/</span> ${navItems.find(n=>n[0]===page)?.[2]||'Épisode'}</div><div style="font-size:11px;color:#9b8c7f;margin-top:5px">Espace partagé entre deux organisateurs</div></div><div class="head-actions">${roleSwitch()}<div class="avatar">${appState.role==='lead'?'R':'P'}</div></div></header><div class="content">${page==='dashboard'?dashboard():page==='episodes'?episodes():page==='episode'?episodeDetail():page==='people'?people():page==='studio'?studio():page==='messages'?messages():page==='feedback'?feedback():page==='library'?library():settings()}</div></main></div><div class="mobile-bar">${[['dashboard','⌂','Accueil'],['episodes','▦','Épisodes'],['people','♙','Alumni'],['messages','◱','Messages'],['studio','✧','Studio']].map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div>`}
function dashboard(){const lead=appState.role==='lead',e=seededEpisodes[0];let tasks=allTasks().filter(t=>t.owner===appState.role&&!checked(t.key)).slice(0,5);let reqs=appState.requests.filter(r=>!r.resolved);return `<div class="spaced"><div><div class="eyebrow">${lead?'Relations alumni & animation':'Production & coordination'}</div><h2 class="heading">${lead?'Bonjour, côté intervenants.':'Bonjour, côté organisation.'}</h2><p class="sub">${lead?'Les profils à contacter, les demandes internes et les sessions à animer.':'Vos prochaines productions, contenus à préparer et échéances en un coup d’œil.'}</p></div><button class="btn primary" onclick="openAddCandidate()">+ Proposer un intervenant</button></div><div class="section hero card"><div class="hero-left"><div class="tiny-line">${makeBadge('Prochain épisode','amber')} <span class="fine">#10 · Exemple tiré des supports fournis</span></div><h3>${esc(e.name)}</h3><div class="promo">Promotion ${esc(e.promo)} · ${esc(e.job)} · ${esc(e.company)}</div><div class="date">◷ ${datefmt(e.date)} · ${e.time} (GMT+2)</div><button class="btn primary" style="margin-top:20px" onclick="openEpisode('10',3)">Ouvrir le parcours →</button></div><div class="hero-right"><small>S’INSPIRER · PARTAGER</small><div class="big-num">10</div><small>VOIX D’ALUMNI / ÉPISODE</small></div></div><div class="kpis"><div class="card kpi"><div class="label">Épisodes illustrés</div><div class="v">${getEpisodes().length}</div></div><div class="card kpi"><div class="label">Demandes internes ouvertes</div><div class="v">${reqs.length}</div></div><div class="card kpi"><div class="label">Tâches ${lead?'relation/animation':'production'} à vérifier</div><div class="v">${allTasks().filter(t=>t.owner===appState.role&&!checked(t.key)).length}</div></div></div><div class="cols section"><section class="card panel"><div class="panel-hd"><h3 class="panel-title">${lead?'Mes actions côté intervenants':'À faire côté production'}</h3><button class="textlink" onclick="openEpisode('10',0)">Voir le parcours →</button></div>${tasks.map(t=>taskLine(t)).join('')}<p class="fine" style="margin-top:16px">Checklist de démonstration : aucun accomplissement réel n’est déduit des captures.</p></section><section class="card panel"><div class="panel-hd"><h3 class="panel-title">${lead?'Demandes à traiter':'Propositions et suivi'}</h3><button class="textlink" onclick="go('people')">Voir les profils →</button></div>${lead?reqs.map(r=>`<div class="list-item"><div class="initial">?</div><div class="list-item-main"><b>Demande interne · Épisode #${esc(r.episode)}</b><small>${esc(r.text)}</small></div><button class="btn tiny" onclick="resolveRequest(${r.id})">Résoudre</button></div>`).join('')||'<div class="empty">Aucune demande en attente</div>':getEpisodes().slice(0,3).map(e=>`<div class="list-item"><div class="initial">${esc(e.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div class="list-item-main"><b>${esc(e.name)}</b><small>#${esc(e.id)} · ${esc(e.state)}</small></div><button class="textlink" onclick="openEpisode('${e.id}',2)">Voir →</button></div>`).join('')}</section></div><div class="tipbar">ℹ️ La vue « Responsable » et la vue « Production » donnent accès aux mêmes fiches, mais mettent en avant des actions différentes. Aucun message n’est envoyé depuis ce prototype.</div>`}
function taskLine(t){return `<div class="task"><input class="tick" type="checkbox" ${checked(t.key)?'checked':''} onchange="toggleTask('${t.key}',this.checked)" aria-label="${esc(t.text)}"/><div class="task-content ${checked(t.key)?'done':''}"><b>${esc(t.text)}</b><small>${stages[t.phase].title}</small></div><span class="tiny-badge">${t.required?'Important':'Optionnel'}</span></div>`}
function episodes(){return `<div class="spaced"><div><div class="eyebrow">Calendrier et historique</div><h2 class="heading">Les épisodes</h2><p class="sub">Une fiche par session, avec son parcours, ses contenus et son historique de préparation.</p></div><button class="btn primary" onclick="openAddCandidate()">+ Nouvelle proposition</button></div><div class="ep-grid">${getEpisodes().map(e=>{const p=totalProgress(e.id);return `<button class="card ep-card" onclick="openEpisode('${esc(e.id)}',${e.status==='proposed'?1:3})"><div class="tiny-line"><span class="eyebrow">ÉPISODE #${esc(e.id)}</span>${makeBadge(e.state,e.status==='past'?'gray':e.status==='proposed'?'amber':'green')}</div><h3>${esc(e.name)}</h3><p class="long muted">${esc(e.job)} ${e.company?'· '+esc(e.company):''}</p><div class="calendar"><div class="num">${/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')?e.date.slice(8,10):'—'}</div><div><b>${datefmt(e.date)}</b><br/><small>${esc(e.time||'Horaire à confirmer')}</small></div></div><div class="foot"><span>${p.done}/${p.total} tâches importantes cochées en démo</span><span>Ouvrir ↗</span></div></button>`}).join('')}</div><div class="tipbar">Les statuts et checklists présentés dans cette maquette sont des exemples de fonctionnement, pas un état de suivi synchronisé avec vos messages WhatsApp ou votre Google Sheets.</div>`}
function episodeDetail(){let e=ep(),st=stages[appState.stage],p=totalProgress(e.id),req=appState.requests.filter(r=>!r.resolved&&r.episode===e.id);return `<div class="spaced"><div><button class="textlink" onclick="go('episodes')">← Tous les épisodes</button><div class="eyebrow" style="margin-top:14px">Épisode #${esc(e.id)} · ${esc(e.state)}</div><h2 class="heading">${esc(e.name)}</h2><p class="sub">Promo ${esc(e.promo)} · ${esc(e.job)} ${e.company?'· '+esc(e.company):''}</p><div class="tiny-line" style="margin-top:14px">${makeBadge('📅 '+datefmt(e.date))} ${makeBadge('◷ '+e.time,'gray')} ${makeBadge('Référente : responsable','gray')}</div></div><button class="btn" onclick="go('people')">Voir la fiche intervenant ↗</button></div><div class="card" style="padding:18px 23px;margin-top:24px"><div class="spaced"><div><b>Parcours de l’épisode</b><div class="fine">${p.done} sur ${p.total} actions importantes cochées dans cette démo</div></div><b style="font-size:13px;color:#9a7253">${p.pct}%</b></div><div class="progress"><span style="width:${p.pct}%"></span></div></div><div class="detail-layout"><div class="card stages">${stages.map((s,i)=>{let count=s.tasks.filter((t,ti)=>checked(e.id+'-'+i+'-'+ti)).length;return `<button class="stage ${i===appState.stage?'active':''}" onclick="setStage(${i})"><span class="stage-num">${i+1}</span><span style="flex:1"><span class="stage-title">${s.title}</span><span class="stage-sub">${roleName(s.owner)} · ${count}/${s.tasks.length}</span></span>${count===s.tasks.length?'<span class="stage-check">✓</span>':''}</button>`}).join('')}</div><div class="card detail-panel"><div class="spaced"><div><div class="eyebrow">Étape ${appState.stage+1} sur ${stages.length} · ${roleName(st.owner)}</div><h3>${esc(st.title)}</h3></div>${makeBadge('Parcours type','gray')}</div><p class="intro">${esc(st.description)}</p><h4 style="margin:20px 0 7px;font-size:13px">Actions à effectuer</h4>${st.tasks.map((t,i)=>{let k=e.id+'-'+appState.stage+'-'+i;return `<label class="step-task"><input class="tick" type="checkbox" ${checked(k)?'checked':''} onchange="toggleTask('${k}',this.checked)"/><div style="flex:1"><strong style="font-size:13px;font-weight:650;${checked(k)?'text-decoration:line-through;color:#aaa':''}">${esc(t[0])}</strong><div class="task-meta"><span class="owner-pill ${t[1]==='lead'?'lead':''}">${roleName(t[1])}</span><span class="required">${t[2]?'Action importante':'Facultatif'}</span></div></div></label>`}).join('')}<div class="note"><h4>💡 Règle métier</h4><p>${esc(st.note)}</p></div>${req.length?`<div class="note"><h4>⏳ Demande interne à traiter</h4>${req.map(r=>`<p style="margin-bottom:9px">${esc(r.text)}</p><button class="btn tiny" onclick="resolveRequest(${r.id})">Marquer comme résolue</button>`).join('')}</div>`:''}<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px">${appState.stage===2?`<button class="btn soft" onclick="openRequestModal()">+ Demander une information</button>`:''}${appState.stage===3?`<button class="btn soft" onclick="go('studio')">Ouvrir le studio créatif →</button><button class="btn" onclick="go('messages')">Préparer le message →</button>`:''}${appState.stage===6?`<button class="btn soft" onclick="go('feedback')">Voir le formulaire →</button>`:''}<button class="btn primary" onclick="setStage(${Math.min(appState.stage+1,7)})">${appState.stage===7?'Dernière étape':'Étape suivante →'}</button></div></div></div>`}
function people(){let items=getEpisodes();return `<div class="spaced"><div><div class="eyebrow">Vivier & relations</div><h2 class="heading">Intervenants</h2><p class="sub">Les propositions peuvent exister sans date ni épisode confirmé. Un même alumni peut intervenir à plusieurs sessions.</p></div><button class="btn primary" onclick="openAddCandidate()">+ Proposer un intervenant</button></div><div class="card section" style="padding:9px 22px">${items.map(e=>`<div class="list-item" style="padding:17px 0"><div class="initial">${esc(e.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div class="list-item-main"><b style="font-size:15px">${esc(e.name)}</b><small>Promotion ${esc(e.promo)} · ${esc(e.job)} · ${esc(e.company||'Entreprise non renseignée')}</small><div style="margin-top:8px">${makeBadge(e.status==='proposed'?'Proposition':e.status==='past'?'Déjà intervenu':'Épisode en préparation',e.status==='past'?'gray':'amber')}</div></div><button class="btn tiny" onclick="openEpisode('${esc(e.id)}',1)">Ouvrir la fiche →</button></div>`).join('')}</div><div class="tipbar">Exemple de relais : la responsable crée le profil → la production reçoit une notification interne → toute demande de précision revient à la responsable.</div>`}
function studio(){let e=ep();return `<div class="eyebrow">Production visuelle</div><h2 class="heading">Studio créatif</h2><p class="sub">Un exemple de moteur de modèles : données de l’épisode, aperçu avant export et validation humaine.</p><div class="studio-layout"><div class="card panel"><div class="panel-hd"><h3 class="panel-title">Modèle d’annonce</h3>${makeBadge('Aperçu de principe','amber')}</div><div class="poster"><div class="logos"><span>ESMT ⟡</span><span>◉ CPS</span></div><div class="logo-rule"></div><div><div class="micro">♩</div><div class="title">VOIX D’ALUMNI</div></div><div class="photo-placeholder">PHOTO À INSÉRER</div><div class="person">${e.name.split(' ').map(esc).join('<br>')}</div><div class="job">${esc(e.job)}<br/>${esc(e.company)}</div><div style="color:#a48264;letter-spacing:.3em;font-size:12px">PROMO ${esc(e.promo)}</div><div><small style="letter-spacing:.22em">WEBINAIRE</small><div class="dt">${datefmt(e.date)}</div><small>${esc(e.time)}</small></div><div class="foot">S’INSPIRER · PARTAGER · RÉUSSIR ENSEMBLE</div></div><p class="fine">Les logos et la photographie sont des emplacements illustratifs : les originaux de votre charte devront être importés au moment de l’implémentation.</p></div><div class="card panel"><h3 class="panel-title">Informations du modèle</h3><p class="muted" style="font-size:12px">Les champs proviennent de la fiche épisode. Dans la vraie application, tu pourras ajuster les textes, le recadrage et la composition.</p><div class="divider"></div><div class="field"><label>Intervenant</label><input value="${esc(e.name)}" readonly/></div><div class="field" style="margin-top:14px"><label>Promotion</label><input value="${esc(e.promo)}" readonly/></div><div class="field" style="margin-top:14px"><label>Fonction</label><input value="${esc(e.job)}" readonly/></div><div class="field" style="margin-top:14px"><label>Photo et logos</label><input value="À intégrer dans le produit" readonly/></div><div class="note"><h4>Validation avant publication</h4><p>L’export final doit vérifier l’orthographe, la date, la photo autorisée et le logo officiel.</p></div><button class="btn primary" onclick="toast('Aperçu du modèle affiché. Export réel à développer en V2.')">Prévisualisation du modèle ✓</button></div></div>`}
function messages(){let tab=appState.msgTab||'announcement';return `<div class="eyebrow">Messages à préparer · pas d’envoi automatique</div><h2 class="heading">Communications</h2><p class="sub">Rédiger, relire, copier puis confirmer manuellement la publication dans la communauté WhatsApp.</p><div class="tabs"><button class="${tab==='announcement'?'active':''}" onclick="setMsgTab('announcement')">Annonce de l’épisode</button><button class="${tab==='thanks'?'active':''}" onclick="setMsgTab('thanks')">Merci + feedback</button></div><div class="cols section"><section class="card panel"><div class="panel-hd"><h3 class="panel-title">${tab==='announcement'?'Annonce WhatsApp':'Message après session'}</h3>${makeBadge('Brouillon','amber')}</div><div class="field"><label>Texte modifiable</label><textarea rows="14" style="min-height:300px;line-height:1.65" oninput="updateMessage('${tab}',this.value)">${esc(appState.messages[tab])}</textarea></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:13px"><button class="btn primary" onclick="copyMessage('${tab}')">⧉ Copier le message</button><button class="btn" onclick="confirmManualPublish()">Confirmer la publication (démo)</button></div><p class="fine">La confirmation indique uniquement qu’un organisateur déclare l’avoir publié ; elle ne contacte aucun groupe.</p></section><section class="card panel"><h3 class="panel-title">Calendrier de communication</h3>${[['J-7','Annonce avec affiche','Publication manuelle vérifiée'],['J-1','Rappel de réunion','Lien Teams relu'],['Jour J','Accès et animation','Pas de diffusion automatique'],['Après session','Remerciement + feedback','Dès que possible'],['Après replay','Affiche finale + YouTube','Après vérification']].map(x=>`<div class="remind"><div><strong>${x[0]} · ${x[1]}</strong><small>${x[2]}</small></div><span class="badge gray">À suivre</span></div>`).join('')}<div class="note"><h4>WhatsApp</h4><p>La gestion des publications dans les groupes existants commence par « préparer → copier → envoyer → confirmer ». Aucun robot n’est supposé disposer des droits de publication.</p></div></section></div>`}
function feedback(){return `<div class="eyebrow">Écoute de la communauté</div><h2 class="heading">Feedback des sessions</h2><p class="sub">Un formulaire réutilisable, avec un lien unique par épisode et des questions spécifiques si nécessaire.</p><div class="cols section"><div class="feedback-preview"><div class="eyebrow">VOIX D’ALUMNI · ÉPISODE #10</div><h3>Ton retour sur la session</h3><p class="muted">Exemple de formulaire public — non connecté à un système de collecte.</p><div class="field"><label>Comment évalues-tu cette session ?</label><div class="tiny-line" style="margin:10px 0">${[1,2,3,4,5].map(n=>`<label style="margin-right:13px"><input type="radio" name="rating"/> ${n}</label>`).join('')}</div></div><div class="field"><label>Qu'as-tu le plus apprécié ?</label><textarea placeholder="Ton retour..."></textarea></div><div class="field"><label>Quel thème souhaiterais-tu pour la suite ?</label><input placeholder="Suggestions de sujets / intervenants"/></div><button class="btn primary" onclick="toast('Ceci est un aperçu : aucune réponse n’a été enregistrée.')">Aperçu uniquement</button></div><div class="card panel"><h3 class="panel-title">Synthèse de feedback</h3><div class="empty" style="margin-top:18px"><strong>Aucune donnée branchée</strong>Le prototype n’invente pas de réponses. La V2 pourra accueillir vos résultats Google Forms et un formulaire public intégré.</div><div class="note"><h4>Confidentialité des réponses</h4><p>Choisir pour chaque épisode si la collecte est anonyme, puis limiter l'accès aux réponses détaillées aux deux organisateurs.</p></div></div></div>`}
function library(){return `<div class="eyebrow">Ressources de chaque épisode</div><h2 class="heading">Médiathèque</h2><p class="sub">Un emplacement central pour retrouver les supports, le replay, les transcriptions et les citations utiles.</p><div class="ep-grid">${[['▧','Photos & logos','Originaux autorisés, versions finales, références de la charte'],['◧','Affiches','Annonce de session et remerciement final'],['▶','Replays YouTube','Liens, état de publication et autorisation'],['≡','Transcriptions','Texte relu, résumé et citations vérifiées'],['◱','Messages & documents','Copies validées, conducteur et ressources'],['◉','Feedback','Questionnaires et bilans par épisode']].map(x=>`<div class="card panel"><div style="font-size:26px;color:#b28c6b">${x[0]}</div><h3 class="panel-title" style="margin-top:10px">${x[1]}</h3><p class="muted" style="font-size:12px">${x[2]}</p>${makeBadge('À connecter en V1/V2','gray')}</div>`).join('')}</div>`}
function settings(){return `<div class="eyebrow">Configuration du parcours</div><h2 class="heading">Paramètres</h2><p class="sub">Le modèle de travail par défaut reste modifiable pour chaque session.</p><div class="cols section"><div class="card panel"><h3 class="panel-title">Échéances suggérées</h3>${[['J-14','Informations intervenant / photo'],['J-7','Affiche et annonce'],['J-3','Préparation technique'],['J-1','Rappel communauté'],['Jour J','Animation et enregistrement'],['J+0','Merci à chaud et formulaire'],['J+3','Replay et transcription si disponibles']].map(x=>`<div class="remind"><div><strong>${x[0]}</strong><small>${x[1]}</small></div>${makeBadge('Modèle','gray')}</div>`).join('')}</div><div class="card panel"><h3 class="panel-title">Règles non négociables</h3>${['La responsable est l’unique contact de l’intervenant.','Les messages à la communauté exigent une confirmation de publication.','La photo, les citations et la vidéo sont publiées avec les autorisations adaptées.','Le report d’un épisode recalcule les échéances futures seulement.','Les actions importantes doivent être cochées pour clôturer un épisode.'].map(x=>`<div class="task"><span style="color:#43826a">✓</span><div>${x}</div></div>`).join('')}<div class="divider"></div><button class="btn" onclick="resetDemo()">↺ Réinitialiser la démonstration</button></div></div>`}
function go(page){appState.page=page;save();render();window.scrollTo(0,0)}
function setRole(role){appState.role=role;save();render()}
function openEpisode(id,stage=0){appState.episode=id;appState.stage=stage;go('episode')}
function setStage(i){appState.stage=i;save();render()}
function toggleTask(k,v){appState.checks[k]=v;save();render()}
function setMsgTab(tab){appState.msgTab=tab;save();render()}
function updateMessage(tab,val){appState.messages[tab]=val;save()}
async function copyMessage(tab){try{await navigator.clipboard.writeText(appState.messages[tab]);toast('Message copié. À publier manuellement dans WhatsApp.')}catch(e){toast('Copie indisponible depuis ce navigateur. Sélectionnez le texte du brouillon.')}}
function confirmManualPublish(){openModal(`<h3>Confirmer la publication</h3><p class="muted">Cette action ne publie rien sur WhatsApp. Elle enregistre uniquement une déclaration de suivi dans ce prototype.</p><div class="modal-foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="closeModal();toast('Confirmation enregistrée dans la démonstration uniquement.')">Je confirme l’avoir envoyé</button></div>`)}
function openRequestModal(){let e=ep();openModal(`<h3>Demander une information</h3><p class="muted">La demande est envoyée dans l’espace interne de la responsable, jamais directement à ${esc(e.name)}.</p><div class="field"><label>Information nécessaire</label><textarea id="requestText" placeholder="Ex. Peux-tu confirmer la fonction exacte auprès de l’intervenant ?" style="min-height:100px"></textarea></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="submitRequest()">Créer la demande interne</button></div>`)}
function submitRequest(){let x=document.getElementById('requestText')?.value.trim();if(!x){toast('Saisissez la demande avant de continuer.');return}appState.requests.push({id:Date.now(),episode:ep().id,text:x,resolved:false});save();closeModal();render();toast('Demande créée pour la responsable (démo).')}
function resolveRequest(id){let r=appState.requests.find(x=>x.id===id);if(r){r.resolved=true;save();render();toast('Demande marquée résolue.')}}
function openAddCandidate(){openModal(`<h3>Proposer un intervenant</h3><p class="muted">Un formulaire court à remplir par la responsable. La session peut rester provisoire.</p><div class="form-row"><div class="field"><label>Nom et prénom *</label><input id="candName" placeholder="Ex. Aminata Fall"/></div><div class="field"><label>Promotion *</label><input id="candPromo" placeholder="Ex. 2014"/></div><div class="field"><label>Fonction</label><input id="candJob" placeholder="Poste actuel"/></div><div class="field"><label>Entreprise</label><input id="candCompany" placeholder="Entreprise"/></div><div class="field"><label>Date envisagée</label><input type="date" id="candDate"/></div><div class="field"><label>Lien LinkedIn</label><input id="candLinkedIn" placeholder="https://www.linkedin.com/in/..."/></div></div><p class="fine" style="margin-top:12px">Dans la V1 : import de photo, notes, historique de contact et statut de confirmation.</p><div class="modal-foot"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="submitCandidate()">Créer la proposition</button></div>`)}
function submitCandidate(){let v=id=>document.getElementById(id)?.value.trim()||'';if(!v('candName')||!v('candPromo')){toast('Nom et promotion obligatoires.');return}let id='D'+(appState.candidates.length+1);let e={id,name:v('candName'),promo:v('candPromo'),job:v('candJob')||'Fonction à compléter',company:v('candCompany'),date:v('candDate'),time:'À confirmer',state:'Proposition',tag:'Brouillon',status:'proposed',linkedin:v('candLinkedIn')};appState.candidates.push(e);appState.episode=id;appState.stage=0;save();closeModal();go('episode');toast('Proposition ajoutée à la démonstration.')}
function openModal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-shade" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
let toastTimer;function toast(message){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.textContent=message;document.body.appendChild(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3600)}
function resetDemo(){if(confirm('Réinitialiser les coches, demandes et propositions créées dans cette maquette ?')){appState={...defaults,checks:{},messages:{...defaults.messages},requests:[...defaults.requests],candidates:[]};save();render();toast('Démonstration réinitialisée.')}}
render();
</script>
</body>
</html>
