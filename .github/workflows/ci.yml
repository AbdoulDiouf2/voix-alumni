name: Voix d'Alumni checks

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: voix_alumni_test
          POSTGRES_DB: voix_alumni_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voix_alumni_test -d voix_alumni_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://voix_alumni_test@127.0.0.1:5432/voix_alumni_test
      BETTER_AUTH_URL: http://127.0.0.1:5173
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Générer un secret éphémère de test
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Vérifier le journal des changements techniques
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/require-dev-journal.sh "$BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate:test -w @voix-alumni/db
      - run: npm run test
      - run: npm run build
